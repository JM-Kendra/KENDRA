[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kendra-api"
version = "0.1.0"
description = "Kendra local document-ingestion API"
requires-python = ">=3.12"
dependencies = [
  "asyncpg==0.31.0",
  "docling-slim[cli,format-pdf,models-local]==2.117.0",
  "fastapi==0.139.2",
  "httpx==0.28.1",
  "pypdf==6.6.2",
  "pydantic-settings==2.14.2",
  "qdrant-client==1.18.0",
  "scipy==1.18.0",
  "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
test = [
  "pillow>=12.1,<13",
  "pytest>=9.0,<10",
  "pytest-asyncio>=1.3,<2",
  "reportlab>=4.4,<5",
]

[project.scripts]
kendra-ingest = "kendra_api.ingestion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -m 'not milestone10 and not milestone10_live'"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "milestone10: Milestone 10 verification contract; unimplemented by design, deselected by default",
  "milestone10_live: Milestone 10 contract requiring an ingested corpus and live services",
]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true
