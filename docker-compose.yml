name: kendra

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${KENDRA_POSTGRES_DATABASE:-kendra}
      POSTGRES_USER: ${KENDRA_POSTGRES_USER:-kendra}
      POSTGRES_PASSWORD: ${KENDRA_POSTGRES_PASSWORD:?Copy .env.example to .env and set KENDRA_POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks: [kendra_private]

  qdrant:
    image: qdrant/qdrant:v1.18.2
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks: [kendra_private]

  ollama:
    image: ollama/ollama:0.32.0
    environment:
      # Unset, this falls back to Ollama's own built-in default (measured at
      # 4096 tokens, well under qwen2.5:7b-instruct's trained 32768 --
      # evaluation/M12_FINDINGS.md part (f)). Matches ANSWER_NUM_CTX in
      # apps/api/src/kendra_api/answering/model_client.py.
      OLLAMA_CONTEXT_LENGTH: "8192"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped
    networks: [kendra_private]

  api:
    build:
      context: ./apps/api
      target: runtime
      args:
        # Bakes the revision into the image at build time (Dockerfile's `runtime`
        # stage ARG/ENV) so a plain `docker compose up` reports it without an export
        # at every start -- only at build/rebuild time. Blank if not exported here;
        # see the `environment:` comment below for why it isn't also set there.
        KENDRA_SOURCE_REVISION: ${KENDRA_SOURCE_REVISION:-}
    environment:
      KENDRA_ENVIRONMENT: ${KENDRA_ENVIRONMENT:-development}
      KENDRA_LOG_LEVEL: ${KENDRA_LOG_LEVEL:-INFO}
      KENDRA_API_HOST: 0.0.0.0
      KENDRA_API_PORT: 8000
      KENDRA_CORS_ORIGINS: ${KENDRA_CORS_ORIGINS:-["http://127.0.0.1:3000"]}
      KENDRA_READINESS_TIMEOUT_SECONDS: ${KENDRA_READINESS_TIMEOUT_SECONDS:-3}
      KENDRA_POSTGRES_HOST: ${KENDRA_POSTGRES_HOST:-postgres}
      KENDRA_POSTGRES_PORT: ${KENDRA_POSTGRES_PORT:-5432}
      KENDRA_POSTGRES_DATABASE: ${KENDRA_POSTGRES_DATABASE:-kendra}
      KENDRA_POSTGRES_USER: ${KENDRA_POSTGRES_USER:-kendra}
      KENDRA_POSTGRES_PASSWORD: ${KENDRA_POSTGRES_PASSWORD:?Copy .env.example to .env and set KENDRA_POSTGRES_PASSWORD}
      KENDRA_QDRANT_URL: ${KENDRA_QDRANT_URL:-http://qdrant:6333}
      KENDRA_QDRANT_API_KEY: ${KENDRA_QDRANT_API_KEY:-}
      KENDRA_OLLAMA_URL: ${KENDRA_OLLAMA_URL:-http://ollama:11434}
      KENDRA_DOCUMENT_STORE_ROOT: ${KENDRA_DOCUMENT_STORE_ROOT:-/documents}
      KENDRA_PDF_MAX_BYTES: ${KENDRA_PDF_MAX_BYTES:-52428800}
      KENDRA_PDF_MAX_PAGES: ${KENDRA_PDF_MAX_PAGES:-500}
      KENDRA_MINIMUM_PAGE_TEXT_CHARS: ${KENDRA_MINIMUM_PAGE_TEXT_CHARS:-40}
      KENDRA_CHUNK_SIZE_CHARS: ${KENDRA_CHUNK_SIZE_CHARS:-1200}
      KENDRA_CHUNK_OVERLAP_CHARS: ${KENDRA_CHUNK_OVERLAP_CHARS:-200}
      KENDRA_INGESTION_TOOL_TIMEOUT_SECONDS: ${KENDRA_INGESTION_TOOL_TIMEOUT_SECONDS:-300}
      KENDRA_EMBEDDING_MODEL: ${KENDRA_EMBEDDING_MODEL:-bge-m3}
      KENDRA_EMBEDDING_BATCH_SIZE: ${KENDRA_EMBEDDING_BATCH_SIZE:-16}
      KENDRA_QDRANT_COLLECTION_PREFIX: ${KENDRA_QDRANT_COLLECTION_PREFIX:-kendra_ingestion}
      # KENDRA_SOURCE_REVISION is intentionally NOT set here. Compose's `environment:`
      # substitution always assigns a concrete value -- even `${VAR:-}` explicitly
      # sets an empty string -- which would override the image's own baked-in
      # default (see the Dockerfile and this service's build.args above) on every
      # `docker compose up`, defeating it. Leaving the key out entirely lets the
      # image's baked value show through; an operator who needs to override it at
      # container-start without rebuilding can still do so explicitly, e.g.
      # `docker compose run -e KENDRA_SOURCE_REVISION=<sha> api ...` or a local
      # compose override file -- `docker run -e` / an explicit override always beats
      # an image's own ENV default, same as any other Dockerfile ENV.
      # No .git is mounted into this read-only container either way, so
      # source_revision.py's own git fallback never fires here; if neither the build
      # arg nor a runtime override supplies a revision, it degrades honestly to
      # "unknown" rather than crashing the API at startup.
      KENDRA_SOURCE_REVISION_DIRTY: ${KENDRA_SOURCE_REVISION_DIRTY:-false}
      KENDRA_ANSWERING_ENABLED: ${KENDRA_ANSWERING_ENABLED:-false}
      KENDRA_ANSWER_MODEL: ${KENDRA_ANSWER_MODEL:-qwen2.5:7b-instruct}
      KENDRA_ANSWER_TIMEOUT_SECONDS: ${KENDRA_ANSWER_TIMEOUT_SECONDS:-120}
      KENDRA_RETRIEVAL_TOP_K: ${KENDRA_RETRIEVAL_TOP_K:-8}
      KENDRA_RETRIEVAL_SCORE_THRESHOLD: ${KENDRA_RETRIEVAL_SCORE_THRESHOLD:-0.5}
      # EXP-13 (docs/experiment-decisions/EXP-13-preregistration.md): "current"
      # is the unchanged default; "labeled" is experimental (R1_LABELED), never
      # adopted as the default regardless of that experiment's outcome.
      KENDRA_EVIDENCE_RENDERING: ${KENDRA_EVIDENCE_RENDERING:-current}
    volumes:
      - type: bind
        source: ${KENDRA_DOCUMENT_STORE_HOST_PATH:-./document-repository}
        target: ${KENDRA_DOCUMENT_STORE_ROOT:-/documents}
        read_only: true
    ports:
      - ${KENDRA_API_BIND_HOST:-127.0.0.1}:${KENDRA_API_PORT:-8000}:8000
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    networks: [kendra_private, kendra_edge]

  ingest:
    profiles: [ingestion]
    build:
      context: ./apps/api
      target: runtime
    entrypoint: ["kendra-ingest"]
    command: ["--help"]
    environment:
      KENDRA_ENVIRONMENT: ${KENDRA_ENVIRONMENT:-development}
      KENDRA_POSTGRES_HOST: ${KENDRA_POSTGRES_HOST:-postgres}
      KENDRA_POSTGRES_PORT: ${KENDRA_POSTGRES_PORT:-5432}
      KENDRA_POSTGRES_DATABASE: ${KENDRA_POSTGRES_DATABASE:-kendra}
      KENDRA_POSTGRES_USER: ${KENDRA_POSTGRES_USER:-kendra}
      KENDRA_POSTGRES_PASSWORD: ${KENDRA_POSTGRES_PASSWORD:?Copy .env.example to .env and set KENDRA_POSTGRES_PASSWORD}
      KENDRA_QDRANT_URL: ${KENDRA_QDRANT_URL:-http://qdrant:6333}
      KENDRA_QDRANT_API_KEY: ${KENDRA_QDRANT_API_KEY:-}
      KENDRA_OLLAMA_URL: ${KENDRA_OLLAMA_URL:-http://ollama:11434}
      KENDRA_DOCUMENT_STORE_ROOT: ${KENDRA_DOCUMENT_STORE_ROOT:-/documents}
      KENDRA_INGESTION_INTAKE_ROOT: ${KENDRA_INGESTION_INTAKE_ROOT:-/intake}
      KENDRA_DOCLING_ARTIFACTS_PATH: ${KENDRA_DOCLING_ARTIFACTS_PATH:-/models/docling}
      KENDRA_PDF_MAX_BYTES: ${KENDRA_PDF_MAX_BYTES:-52428800}
      KENDRA_PDF_MAX_PAGES: ${KENDRA_PDF_MAX_PAGES:-500}
      KENDRA_MINIMUM_PAGE_TEXT_CHARS: ${KENDRA_MINIMUM_PAGE_TEXT_CHARS:-40}
      KENDRA_CHUNK_SIZE_CHARS: ${KENDRA_CHUNK_SIZE_CHARS:-1200}
      KENDRA_CHUNK_OVERLAP_CHARS: ${KENDRA_CHUNK_OVERLAP_CHARS:-200}
      KENDRA_INGESTION_TOOL_TIMEOUT_SECONDS: ${KENDRA_INGESTION_TOOL_TIMEOUT_SECONDS:-300}
      KENDRA_EMBEDDING_MODEL: ${KENDRA_EMBEDDING_MODEL:-bge-m3}
      KENDRA_EMBEDDING_BATCH_SIZE: ${KENDRA_EMBEDDING_BATCH_SIZE:-16}
      KENDRA_QDRANT_COLLECTION_PREFIX: ${KENDRA_QDRANT_COLLECTION_PREFIX:-kendra_ingestion}
      KENDRA_SOURCE_REVISION: ${KENDRA_SOURCE_REVISION:-unknown}
    volumes:
      - type: bind
        source: ${KENDRA_DOCUMENT_STORE_HOST_PATH:-./document-repository}
        target: ${KENDRA_DOCUMENT_STORE_ROOT:-/documents}
      - type: bind
        source: ${KENDRA_INGESTION_INTAKE_HOST_PATH:-./intake}
        target: ${KENDRA_INGESTION_INTAKE_ROOT:-/intake}
        read_only: true
      - type: volume
        source: docling_models
        target: ${KENDRA_DOCLING_ARTIFACTS_PATH:-/models/docling}
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    networks: [kendra_private]

  docling-model-loader:
    profiles: [ingestion-setup]
    build:
      context: ./apps/api
      target: runtime
    entrypoint: ["docling-tools"]
    command:
      - models
      - download
      - layout
      - tableformerv2
      - --output-dir
      - /models/docling
    user: "0:0"
    environment:
      HF_HOME: /models/docling/.cache/huggingface
      HF_HUB_CACHE: /models/docling/.cache/huggingface/hub
      HF_XET_CACHE: /models/docling/.cache/huggingface/xet
    volumes:
      - docling_models:/models/docling
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    networks: [kendra_edge]

  ollama-model-loader:
    profiles: [ingestion-setup]
    image: ollama/ollama:0.32.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        ollama serve &
        server_pid=$$!;
        trap 'kill "$$server_pid"' EXIT;
        until ollama list >/dev/null 2>&1; do sleep 1; done;
        ollama pull "$${KENDRA_EMBEDDING_MODEL}"
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
      KENDRA_EMBEDDING_MODEL: ${KENDRA_EMBEDDING_MODEL:-bge-m3}
    volumes:
      - ollama_data:/root/.ollama
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    networks: [kendra_edge]

  web:
    build:
      context: ./apps/web
      target: runtime
      args:
        NEXT_PUBLIC_KENDRA_API_BASE_URL: ${NEXT_PUBLIC_KENDRA_API_BASE_URL:-http://127.0.0.1:8000}
    environment:
      NODE_ENV: production
    ports:
      - ${KENDRA_WEB_BIND_HOST:-127.0.0.1}:${KENDRA_WEB_PORT:-3000}:3000
    depends_on:
      api:
        condition: service_started
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    networks: [kendra_edge]

networks:
  kendra_private:
    internal: true
  kendra_edge:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  ollama_data:
  docling_models:
